buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:2.0.5.RELEASE")
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
//apply plugin: 'org.springframework.boot'
//apply plugin: 'io.spring.dependency-management'

version = '1.0-SNAPSHOT'
group = 'com.mos'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceCompatibility = 21
targetCompatibility = 21


repositories {
    jcenter()

    maven {
        url "http://repo.marketcetera.org/maven"
        allowInsecureProtocol = true
    }

    maven {
        url "https://repo1.maven.org/maven2"
    }
    mavenCentral()
    
 //   flatDir {
 //       dirs 'localLibs'
 //  }
}


sourceSets {
    /*
    main {
        java {
            srcDirs = ['src']
            output.resourcesDir = "build/classes/main"
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
    }
    */
     
}

compileJava {
    options.incremental = true
    options.fork = true
    options.failOnError = false
}

dependencies {

    //Since Jar signed issue, we have to exclude javax.persistence not signed and include signed one.
    implementation ('org.eclipse.persistence:eclipselink:2.7.4') {
        exclude module: "javax.persistence"
    }
    implementation ('javax.persistence:javax.persistence-api:2.2')

    implementation 'org.slf4j:slf4j-api:1.7.5',
            'com.sun.xml.ws:jaxws-ri:2.3.2',
     		'org.apache.activemq:activemq-core:5.7.0',
            'com.google.inject:guice:3.0',
            'com.google.code.gson:gson:2.3.1',
            'com.googlecode.disruptor:disruptor:2.7.1',
            'quickfixj:quickfixj-core:1.5.3',
            'quickfixj:quickfixj-msg-fix50:1.5.3',
           // 'quickfixj:quickfixj-msg-fix44:1.5.3',
           // 'quickfixj:quickfixj-msg-fix43:1.5.3',
           // 'quickfixj:quickfixj-msg-fix42:1.5.3',
           // 'quickfixj:quickfixj-msg-fix41:1.5.3',
           // 'quickfixj:quickfixj-msg-fix40:1.5.3',
           // 'org.apache.mina:mina-core:1.1.7',
            'io.undertow:undertow-core:1.2.0.Final'
           

    runtimeOnly 'org.slf4j:slf4j-api:1.7.5',
            'ch.qos.logback:logback-classic:1.0.13',
            'com.google.inject:guice:3.0',
			'org.apache.derby:derbyclient:10.11.1.1'

    testImplementation 'junit:junit:4.11',
            'org.mockito:mockito-core:1.9.5',
            'org.assertj:assertj-core:1.6.1',
            'org.slf4j:slf4j-api:1.7.5',
            'org.apache.derby:derbyclient:10.11.1.1'
}
